[project]
name = "flottiee-backend"
version = "0.1.0"
description = "Backend сайта flottiee.bond: FastAPI + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    # HTTP-фреймворк и сервер. Swagger/OpenAPI у FastAPI из коробки: /docs, /openapi.json
    "fastapi>=0.115",
    "uvicorn>=0.32",
    # ORM. extras "asyncio" включает async-поддержку drivers
    "sqlalchemy[asyncio]>=2.0.36",
    # асинхронный драйвер PostgreSQL (его видит строка подключения "+asyncpg")
    "asyncpg>=0.30",
    # миграции
    "alembic>=1.14",
    # валидация и конфиг из env-переменных; extra "email" добавляет валидацию EmailStr
    "pydantic[email]>=2.10",
    "pydantic-settings>=2.6",
    # хэширование паролей (в хэш зашита собственная соль)
    "bcrypt>=4.2",
    # подпись и проверка JWT-токенов
    "pyjwt>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# auto: async-тесты не требуют явных @pytest.mark.asyncio
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
